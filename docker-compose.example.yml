services:
  scriptorium:
    image: ghcr.io/anastylosis/scriptorium:latest
    # build: .
    container_name: scriptorium
    volumes:
      # Must resolve to the same container path Stash uses, or set PATH_FROM/PATH_TO.
      - /path/to/your/videos:/data
      - scriptorium-models:/models
    ports:
      - "8088:8088"
    environment:
      - STASH_URL=http://stash:9999
      # Only needed if authentication is enabled: Settings > Security > API Key
      - STASH_API_KEY=
      - MODEL=large-v3-turbo
      - COMPUTE_TYPE=int8
      - THREADS=6
      - POLL_SECONDS=120
      # Any subs:<lang> tag you create in Stash is picked up automatically.
      # Set REQUEST_TAGS to a fixed list only if you want to restrict that.
      # Uncomment together with the ollama service below to enable
      # translation into languages Whisper cannot produce directly.
      # - OLLAMA_URL=http://ollama:11434
      # - OLLAMA_MODEL=translategemma:4b
    restart: unless-stopped

  # No Stash? Drop the service above and use this one instead: it watches a
  # mount, and an empty file named subs.en in a folder asks for English.
  # scriptorium-folder:
  #   image: ghcr.io/anastylosis/scriptorium:latest
  #   volumes:
  #     - /path/to/your/videos:/media
  #     - scriptorium-state:/state
  #     - scriptorium-models:/models
  #   ports:
  #     - "8088:8088"
  #   environment:
  #     - WATCH_DIRS=/media
  #     - WATCH_LANGS=auto
  #   restart: unless-stopped

  # Optional. Start with: docker compose --profile translate up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["translate"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  scriptorium-models:
  scriptorium-state:
  ollama:
