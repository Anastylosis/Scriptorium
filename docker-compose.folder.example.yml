# Folder mode: no Stash. It watches a mount, and an empty file named subs.en
# in a folder asks for English subtitles for every video in it and below.
# Using Stash instead? See docker-compose.example.yml.
services:
  scriptorium:
    image: ghcr.io/anastylosis/scriptorium:latest
    container_name: scriptorium
    volumes:
      - /path/to/your/videos:/media
      # Small; holds the ledger that stops a video being done twice.
      - scriptorium-state:/state
      - scriptorium-models:/models
    ports:
      - "8088:8088"
    environment:
      - WATCH_DIRS=/media
      # With no subs.<lang> marker anywhere, transcribe whatever is spoken.
      - WATCH_LANGS=auto
      # Uncomment together with the ollama service below to enable
      # translation into languages Whisper cannot produce directly.
      # - OLLAMA_URL=http://ollama:11434
      # - OLLAMA_MODEL=translategemma:4b
    restart: unless-stopped

  # Optional. Start with: docker compose --profile translate up -d
  # The worker reaches it as http://ollama:11434 over the compose network, so
  # no port is published: Ollama's API has no authentication.
  ollama:
    image: ollama/ollama:0.35.0
    container_name: ollama
    profiles: ["translate"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  scriptorium-models:
  scriptorium-state:
  ollama:
