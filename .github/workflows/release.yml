name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Local, because it is genuinely specific to this project: the version is
  # baked into every generated subtitle's provenance and shown on the status
  # page, so a stale one mislabels output that outlives the container. It has
  # silently drifted twice. A test comparing pyproject.toml with __init__.py
  # cannot catch it — both go stale together — so the tag is the referee.
  version:
    name: Check the tag matches the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - run: |
          tag="${GITHUB_REF#refs/tags/v}"
          declared=$(python3 -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=${tag} declared=${declared}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v${tag} does not match version ${declared} in pyproject.toml"
            exit 1
          fi

  # The whole build/attest/scan pipeline is shared. Nothing about it was ever
  # specific to this project — it had simply been copied.
  docker:
    needs: version
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: release
      # No go.mod to read a toolchain from, and the Dockerfile declares no
      # VERSION/COMMIT/DATE build args.
      go-version-build-arg: false
      version-build-args: false

  # go-release.yml does not fit here: it runs `go test` and builds Go
  # binaries, and this project ships an image rather than executables. The
  # image *is* the artifact, so the release note points at it.
  notes:
    needs: docker
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image reference
        # OCI references must be lowercase and ${{ github.repository }} can
        # contain uppercase; GitHub expressions have no case conversion. The
        # published tag also has no `v` — docker/metadata-action strips it.
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "repo=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Image

            ```sh
            docker pull ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }}
            ```

            Or `:latest`. Note the published tag has no `v` prefix —
            docker/metadata-action strips it from the git tag.

            `linux/amd64` and `linux/arm64`.

            Verify the build provenance:

            ```sh
            gh attestation verify \
              oci://${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }} \
              --owner ${{ github.repository_owner }}
            ```
