name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag is the version: it is passed into the build and stamped into
  # every subtitle's provenance, so a tag that is not a version does not fail,
  # it ships an image labelled 0.8 whose output claims 0.0.0. Checking the
  # shape is all that is left to check — there is no second copy to disagree
  # with, which is what the old pyproject.toml comparison was guarding and
  # what made a bump necessary before every release.
  version:
    name: Check the tag is a version
    runs-on: ubuntu-latest
    steps:
      - run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${tag} is not vX.Y.Z, so the image would ship a 0.0.0 provenance version"
            exit 1
          fi

  # The whole build/attest/scan pipeline is shared. Nothing about it was ever
  # specific to this project — it had simply been copied.
  docker:
    needs: version
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: release
      # No go.mod to read a toolchain from. VERSION is what carries the tag
      # into the image; the Dockerfile declares it.
      go-version-build-arg: false
      version-build-args: true

  # go-release.yml does not fit here: it runs `go test` and builds Go
  # binaries, and this project ships an image rather than executables. The
  # image *is* the artifact, so the release note points at it.
  notes:
    needs: docker
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image reference
        # OCI references must be lowercase and ${{ github.repository }} can
        # contain uppercase; GitHub expressions have no case conversion. The
        # published tag also has no `v` — docker/metadata-action strips it.
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "repo=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Image

            ```sh
            docker pull ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }}
            ```

            Or `:latest`. Note the published tag has no `v` prefix —
            docker/metadata-action strips it from the git tag.

            `linux/amd64` and `linux/arm64`.

            Verify the build provenance:

            ```sh
            gh attestation verify \
              oci://${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }} \
              --owner ${{ github.repository_owner }}
            ```
