name: Release

# Actions are pinned to exact versions, not moving major tags. A major tag
# like @v7 advances whenever v7.x ships, so an unrelated commit can turn CI
# red. Dependabot proposes bumps; they land deliberately.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # actions/attest-build-provenance needs OIDC + attestation write.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # provenance: true embeds attestation manifests in the image index
          # as `unknown/unknown` entries, which clutters GHCR's UI. SLSA
          # provenance is generated below and stored on the workflow run.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        # Verify with:
        #   gh attestation verify oci://ghcr.io/<owner>/<repo>@<digest> --owner <owner>
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Lowercase image repo for Trivy
        # OCI references must be all-lowercase and ${{ github.repository }}
        # can contain uppercase; GitHub expressions have no case conversion.
        run: echo "IMAGE_REPO_LC=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Trivy scan (informational)
        # exit-code 0: a fail-on-any-finding gate would force base-image
        # bumps on every new CVE. Findings show up in the log; bump deliberately.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPO_LC }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
          ignore-unfixed: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Image

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`

            Verify the build provenance:

            ```sh
            gh attestation verify \
              oci://ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} \
              --owner ${{ github.repository_owner }}
            ```
