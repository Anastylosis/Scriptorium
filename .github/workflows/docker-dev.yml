name: Docker (dev images)

# Tagged releases are handled by release.yml. This publishes development
# images only: tip-of-default-branch and per-commit `sha-<short>`, so a change
# can be pulled onto a real Stash box before a version is cut. Pull requests
# build without pushing.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'scriptorium/**'
      - '.github/workflows/docker-dev.yml'
  workflow_dispatch:

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: dev
      # Python: there is no go.mod to read a toolchain version from, and the
      # Dockerfile declares no VERSION/COMMIT/DATE build args.
      go-version-build-arg: false
      version-build-args: false
