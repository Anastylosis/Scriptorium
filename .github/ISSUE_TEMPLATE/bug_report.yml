name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Tag a scene `subs:fr`
        2. Wait for the poll
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Worker log
      description: >
        `docker logs stash-subs`, or the log section of the status page.
        Redact anything you would rather not share -- paths and scene titles
        appear in it.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Image tag
      placeholder: "ghcr.io/anastylosis/stash-subs:0.5.0"
    validations:
      required: true

  - type: input
    id: stash
    attributes:
      label: Stash version
      placeholder: "v0.28.1"

  - type: input
    id: platform
    attributes:
      label: Host
      description: OS and architecture, and what the library is stored on.
      placeholder: "Debian 12, amd64, library on a local ext4 disk"

  - type: textarea
    id: config
    attributes:
      label: Environment
      description: The environment block from your compose file, minus the API key.
      render: yaml
